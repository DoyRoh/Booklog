<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>책숲</title>
<style>
  html, body { margin: 0; height: 100%; background: #EAF0E5; color: #26362B;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px 24px;
    padding-bottom: calc(32px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.5; color: #5C6B5F; margin: 0 0 24px; max-width: 280px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #1B5E3A; border: 0;
    border-radius: 14px; padding: 14px 28px; font-size: 16px; }
  .lantern { width: 72px; height: 72px; margin-bottom: 20px; }
</style>
</head>
<body>
<main>
  <svg class="lantern" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 3h6M12 3v2.5" /><rect x="7" y="5.5" width="10" height="12" rx="2.5" />
    <path d="M9 17.5v2h6v-2" /><circle cx="12" cy="11.5" r="2.4" fill="#E8A33D" stroke="none" />
  </svg>
  <h1>숲이 잠시 조용하네요</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 책숲은 기록을 서버에 바로 저장하기 때문에 연결이 필요해요.</p>
  <button type="button" onclick="location.href='/'">다시 시도</button>
</main>
</body>
</html>
