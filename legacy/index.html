<style>
:root{
  --paper:#F3EFE9;
  --card:#FFFFFF;
  --ink:#2B2A33;
  --ink-2:#7A7686;
  --rule:#E7E2DA;
  --edge:rgba(38,48,43,.15);
  --edge-2:rgba(38,48,43,.10);
  --red:#D94A32;          /* 도장·주요 버튼 */
  --red-deep:#B23A26;
  --c-red:#E8380D;        /* 배지·표정 아이콘용 선명한 빨강 */ --c-yellow:#FFC93C; --c-green:#3FAE4E;
  --c-blue:#5AC0DE; --c-pink:#E86D93; --c-purple:#7C5CF0;
  --c-teal:#2E6E63; --c-orange:#F2913C;
  --plum:#4A4363;         /* 큰 카드 바탕 */
  --plum-2:#5B5280;
  --teal:#4A4363;
  --sun:#E8AB33;
  --sky:#78A3C6;
  --r:22px;
  --sb: env(safe-area-inset-bottom, 0px);
  --st: env(safe-area-inset-top, 0px);
  --disp:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --hand:"Gamja Flower","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  background-color:var(--paper);
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer}
.d{font-family:var(--disp);font-weight:400;letter-spacing:0}
/* 구글 폰트를 못 받았을 때(오프라인 등) 시스템 폰트로도 또렷하게 */
body.nofont .d,body.nofont .grab .ttl,body.nofont .bank .big b,body.nofont .bank .big i,
body.nofont .bank .seal,body.nofont .tri b,body.nofont .btn,body.nofont .sec h2,body.nofont .q,
body.nofont nav.tabs .lb,body.nofont .catbox > .hd .nm,body.nofont .brow .no,body.nofont .badge .n,
body.nofont .kv .v.d,body.nofont .pb-top .t,body.nofont .mhead,body.nofont .stamp b,body.nofont .hit .s b,
body.nofont .bk .ph .tt,body.nofont .prbtn,body.nofont .rec,body.nofont .seg button,body.nofont .cover-pick .t,
body.nofont .note-pick .t,body.nofont .pickrow .pt{font-weight:800;letter-spacing:-.6px}
body.nofont .qbox .txt,body.nofont .memo,body.nofont .hand{font-weight:700;letter-spacing:-.4px}
.hand{font-family:var(--hand)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none}
body:before{left:-70px;bottom:12%;width:190px;height:190px;
  border-radius:60% 40% 45% 55%/50% 55% 45% 50%;background:rgba(90,192,222,.10)}
body:after{right:-60px;top:32%;width:150px;height:150px;border-radius:34px;transform:rotate(18deg);
  background:rgba(232,109,147,.09)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;overflow-x:hidden}
header.top{position:sticky;top:0;z-index:40;padding:calc(var(--st) + 13px) 20px 11px;overflow:hidden;
  background:rgba(244,240,228,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
header.top:before{content:"";position:absolute;right:-26px;top:-34px;width:96px;height:96px;border-radius:46% 54% 62% 38%/48% 42% 58% 52%;
  background:radial-gradient(circle at 30% 30%,rgba(124,92,240,.18),rgba(90,192,222,.14));pointer-events:none}
.top .mark{width:32px;height:32px;flex:0 0 auto;border-radius:11px;background:var(--plum);color:#FFFDF6;
  display:grid;place-items:center;font-family:var(--disp);font-size:14px;border:1.5px solid var(--edge)}
.top h1{margin:0;font-family:var(--disp);font-size:19px;font-weight:400}
.top .gear{width:36px;height:36px;flex:0 0 auto;margin-left:6px;border-radius:50%;border:1.5px solid var(--rule);
  background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
.top .gear:active{background:var(--paper)}
.top p{margin:0;font-size:11px;color:var(--ink-2);font-weight:700;letter-spacing:.3px}
main{padding:18px 20px calc(104px + var(--sb));animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px calc(9px + var(--sb));
  background:var(--card);border-top:1px solid var(--rule)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--ink-2)}
nav.tabs .lb{font-family:var(--disp);font-size:11px;white-space:nowrap}
nav.tabs button:nth-child(4) .lb{font-size:10px;letter-spacing:-.4px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke-width:2.4}
nav.tabs button.on .lb{position:relative}
nav.tabs button.on .lb:after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:3px;background:var(--plum);border-radius:2px}

/* --- 종이 카드 --- */
.card{background:var(--card);border:none;border-radius:var(--r);padding:20px;margin-bottom:14px;
  box-shadow:0 2px 6px rgba(38,48,43,.07)}
.plain{background:var(--card);border:none;border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(43,42,51,.05)}
.sec{display:flex;align-items:center;gap:9px;margin:24px 2px 11px}
.sec h2{margin:0;font-family:var(--disp);font-size:15px;font-weight:400}
.sec .ln{flex:1;height:2px;background:var(--rule);border-radius:2px}
.sec span{font-size:11.5px;color:var(--ink-2);font-weight:700}

/* --- 기록 표지 --- */
.bank{background:#E7DFCF;border:1.5px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 3px 10px rgba(38,48,43,.10);position:relative;overflow:hidden}
.bank .plate{background:var(--card);border-radius:16px;padding:17px 18px 15px;border:none}
.bank .cap{font-size:10.5px;font-weight:800;letter-spacing:2.5px;color:var(--ink-2)}
.bank .big{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.bank .big b{font-family:var(--disp);font-size:46px;line-height:1;font-weight:400;letter-spacing:-1.5px}
.bank .big i{font-style:normal;font-family:var(--disp);font-size:16px;color:var(--ink-2)}
.bank .mode{position:absolute;top:11px;right:11px;z-index:2;background:var(--card);border:1px solid var(--rule);
  border-radius:99px;padding:6px 11px;font-size:11px;font-weight:800;box-shadow:0 2px 8px rgba(38,48,43,.14)}
.bank .mode:active{opacity:.85}
.bank .seal{position:absolute;top:17px;right:16px;z-index:3;width:50px;height:50px;border-radius:50%;
  border:2px solid var(--red);color:var(--red);display:grid;place-items:center;background:transparent;
  box-shadow:inset 0 0 0 1.5px var(--card), inset 0 0 0 3px var(--red);
  font-family:var(--disp);font-size:16px;transform:rotate(-12deg);opacity:.92;pointer-events:none}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:12px;
  background:rgba(255,255,255,.55);border-radius:14px;overflow:hidden}
.tri div,.tri button{padding:12px 3px;text-align:center;border-right:1px solid rgba(43,42,51,.09);background:none;color:var(--ink)}
.tri > *:last-child{border-right:none}
.tri.four{grid-template-columns:repeat(4,1fr)}
.tri b{display:block;font-family:var(--disp);font-size:19px;line-height:1.15}
.tri b i{font-style:normal;font-size:12px;opacity:.65}
.tri span{font-size:10px;color:var(--ink-2);font-weight:700;display:block;margin-top:2px}
.tri .hb{border-left:1px solid rgba(43,42,51,.09)}
.tri .hb span{color:var(--red)}

/* --- 진도율 막대 --- */
.pbar{position:relative;height:14px;border-radius:8px;background:#EDE6D6;border:none;
  overflow:hidden;margin-top:11px}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,#7C5CF0,#5AC0DE);border-radius:8px;border-right:none;
  transition:width .7s cubic-bezier(.22,1,.36,1)}
.pbar > i[style*="width:0%"]{border-right:none}
.pbar > span{position:absolute;top:0;bottom:0;width:1px;background:rgba(38,48,43,.16)}


/* --- 버튼 --- */
.btn{height:54px;border-radius:14px;font-family:var(--disp);font-size:17px;display:flex;align-items:center;
  justify-content:center;gap:8px;border:1.5px solid var(--edge);box-shadow:0 2px 6px rgba(38,48,43,.07);
  transition:transform .08s, box-shadow .08s;width:100%}
.btn:active{transform:scale(.985);box-shadow:0 1px 3px rgba(38,48,43,.08)}
.btn.red{background:var(--red);color:#FFF8F3}
.btn.sun{background:var(--plum);color:#fff}
.btn.pale{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.42;pointer-events:none}
.row2{display:flex;gap:9px}
.row2 .btn{flex:1;font-size:15px;height:48px}

/* --- 도장 --- */
.stamp{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:1.8px solid var(--red);color:var(--red-deep);
  display:grid;place-items:center;transform:rotate(-11deg);text-align:center;line-height:1.05;
  box-shadow:inset 0 0 0 1.5px var(--card), inset 0 0 0 3px var(--red);opacity:.9}
.stamp b{font-family:var(--disp);font-size:12px;display:block;letter-spacing:-.5px}
.stamp span{font-size:7.5px;font-weight:800;letter-spacing:.4px}
.stamp.sm{width:36px;height:36px;transform:rotate(-8deg);box-shadow:inset 0 0 0 1px var(--card), inset 0 0 0 2px var(--red)}
.stamp.sm b{font-size:10.5px}
.hit{position:fixed;inset:0;display:grid;place-items:center;z-index:96;pointer-events:none}
.hit .s{width:180px;height:180px;border-radius:50%;border:5px solid var(--red);color:var(--red-deep);
  background:rgba(255,253,246,.55);display:grid;place-items:center;text-align:center;line-height:1.1;
  box-shadow:inset 0 0 0 4px rgba(255,253,246,.9), inset 0 0 0 9px var(--red);
  animation:thump .85s cubic-bezier(.2,1.5,.4,1) forwards}
.hit .s b{font-family:var(--disp);font-size:34px;display:block}
.hit .s span{font-size:12px;font-weight:800;letter-spacing:3px}
@keyframes thump{0%{opacity:0;transform:rotate(-32deg) scale(2.7)}
  40%{opacity:1;transform:rotate(-12deg) scale(1)}
  70%{opacity:1;transform:rotate(-12deg) scale(1.03)}
  100%{opacity:0;transform:rotate(-12deg) scale(1.03)}}

/* --- 책장 --- */
.shelfrow{margin-bottom:16px}
.shelfrow .bks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.shelfrow .plank{height:6px;background:#C9BFA8;border-radius:0 0 4px 4px;margin-top:6px;
  box-shadow:0 2px 4px rgba(38,48,43,.10)}
.bk{text-align:left}
.bk .ph{width:100%;aspect-ratio:3/4;border-radius:6px 10px 10px 6px;overflow:hidden;position:relative;
  border:1px solid rgba(38,48,43,.12);background:var(--card);display:grid;place-items:center;
  box-shadow:inset 4px 0 0 rgba(255,255,255,.35);transition:transform .12s}
.bk:active .ph{transform:translateY(-3px)}
.bk .ph img{width:100%;height:100%;object-fit:cover;display:block}
.bk .ph .tt{font-family:var(--disp);font-size:12.5px;text-align:center;padding:8px 6px;line-height:1.3}
.bk .ph .band{position:absolute;left:0;right:0;top:0;height:9px}

/* --- 책등 책장 --- */

/* --- 칩 --- */

.qs{font-family:-apple-system,sans-serif;font-size:11px;font-weight:700;color:var(--ink-2);margin-left:6px}

.prbtn{width:100%;height:48px;border-radius:13px;border:1.5px solid var(--edge);background:var(--card);

  box-shadow:0 1px 4px rgba(38,48,43,.06);margin-bottom:12px}
.prbtn:active{transform:scale(.985);opacity:.9}

.dlg{position:fixed;inset:0;z-index:140;background:rgba(24,30,26,.5);display:none;align-items:center;justify-content:center;padding:26px}
.dlg.show{display:flex}
.dbox{width:100%;max-width:340px;background:var(--card);border:1.5px solid var(--edge);border-radius:18px;
  padding:22px 20px 18px;box-shadow:0 8px 26px rgba(38,48,43,.20)}
.dbox b{display:block;font-family:var(--disp);font-size:19px;margin-bottom:8px}
.dbox p{margin:0 0 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);line-height:1.5;white-space:pre-line}
.dbox input{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--edge);background:var(--paper);
  padding:0 14px;font-size:19px;font-family:var(--disp);text-align:center;outline:none;margin-bottom:14px}
.dacts{display:flex;flex-direction:column;gap:8px}
.dacts button{height:48px;border-radius:13px;border:1.5px solid var(--rule);background:var(--card);
  font-family:var(--disp);font-size:15px;color:var(--ink)}
.dacts button.cancel{background:#F0EBDE;border-color:transparent;color:var(--ink-2)}
.dacts button.ok{background:var(--plum);border-color:var(--plum);color:#fff}
.dacts button.danger{background:var(--red);border-color:rgba(38,48,43,.42);color:#FFFDF6}

.croplayer{position:fixed;inset:0;z-index:120;background:rgba(24,30,26,.94);display:none;
  flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(18px + var(--sb))}
.croplayer.show{display:flex}
.croplayer .ch{display:flex;align-items:center;justify-content:space-between;color:#FFFDF6;margin-bottom:14px}
.croplayer .ch b{font-family:var(--disp);font-size:17px;font-weight:400}
.croplayer .ch span{font-size:11.5px;opacity:.7;font-weight:700}
.cropbox{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;min-height:0}
.cropframe{position:relative;overflow:hidden;border-radius:8px;background:#111;
  box-shadow:0 0 0 2px #FFFDF6, 0 0 0 9999px rgba(24,30,26,.55);touch-action:none}
.cropframe img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;-webkit-user-select:none;user-select:none;pointer-events:none}
.cropframe .gridln{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:33.33% 33.33%;opacity:.5}
.croptools{margin-top:16px}
.croptools .zoom{display:flex;align-items:center;gap:10px;color:#FFFDF6;margin-bottom:12px}
.croptools .zoom input{flex:1;accent-color:#7C5CF0;height:26px}
.croptools .ratios{display:flex;gap:7px;margin-bottom:12px;justify-content:center}
.croptools .ratios button{padding:8px 14px;border-radius:99px;border:1.5px solid rgba(255,253,246,.4);
  background:transparent;color:#FFFDF6;font-size:12.5px;font-weight:800}
.croptools .ratios button.on{background:#FFFDF6;color:var(--ink);border-color:#FFFDF6}
.croptools .acts{display:flex;gap:9px}
.croptools .acts button{flex:1;height:50px;border-radius:14px;font-family:var(--disp);font-size:16px;border:1.5px solid var(--edge)}
.croptools .acts .ok{background:var(--plum);color:#fff;border-color:var(--plum)}
.croptools .acts .no{background:transparent;color:#FFFDF6;border-color:rgba(255,253,246,.45)}

#printArea{display:none}
@media print{
  body{background:#fff !important;background-image:none !important}
  #app,.sheet,.scrim,.toast,nav.tabs,header.top{display:none !important}
  #printArea{display:block !important}
  @page{size:A4 portrait;margin:12mm}
}
#printArea .pg{page-break-after:always;break-after:page;color:#000;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
  height:248mm;overflow:hidden;display:flex;flex-direction:column}
#printArea .pg:last-child{page-break-after:auto;break-after:auto}
#printArea .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:5mm}
#printArea .ph b{font-size:19pt;letter-spacing:-.5px}
#printArea .ph span{font-size:9.5pt}
#printArea .fld{margin-top:5mm}
#printArea .fld > i{display:block;font-style:normal;font-size:10pt;font-weight:800;margin-bottom:2.5mm}
#printArea .ln{border-bottom:1.6px solid #000;height:9mm;font-size:15pt;font-weight:700;display:flex;align-items:flex-end;padding-bottom:1.5mm}
#printArea .two{display:flex;gap:8mm;margin-top:5mm}
#printArea .two > .fld{flex:1;margin-top:0}
#printArea .faces{font-size:15pt;letter-spacing:5px;border-bottom:1.6px solid #000;padding-bottom:2mm}
#printArea .faces b{outline:2px solid #000;border-radius:50%;padding:1px 2px}
#printArea .chk{font-size:13pt;border-bottom:1.6px solid #000;padding-bottom:2mm}
#printArea .lines div{border-bottom:1.4px dotted #555;height:8.5mm;font-size:12.5pt;font-weight:700;display:flex;align-items:flex-end;padding-bottom:1.5mm}
#printArea .draw{flex:1;display:flex;flex-direction:column;margin-bottom:2mm}
#printArea .canvas{flex:1;border:2px solid #000;border-radius:3mm;min-height:52mm;
  background-image:radial-gradient(#ddd 1px,transparent 1px);background-size:6mm 6mm}
#printArea .canvas img{width:100%;height:100%;object-fit:contain}
#printArea .foot{font-size:8.5pt;color:#666;text-align:center;padding-top:3mm;border-top:1.4px solid #ccc;margin-top:4mm}
#printArea .lst{width:100%;border-collapse:collapse;font-size:9.5pt}
#printArea .lst th,#printArea .lst td{border-bottom:1.2px solid #999;padding:2.6mm 1.5mm;text-align:left}
#printArea .lst th{border-bottom:2px solid #000;font-size:9pt}
#printArea .cat3{column-count:2;column-gap:8mm;margin-top:3mm}
#printArea .ci{font-size:10pt;padding:1.4mm 0;break-inside:avoid}
#printArea .cn{font-size:11pt;font-weight:800;margin:4mm 0 1mm;border-bottom:1.6px solid #000;padding-bottom:1mm;break-inside:avoid}
.q{font-family:var(--disp);font-size:19px;margin:0 0 14px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.3px}
.q svg{flex:0 0 auto;align-self:center;opacity:.55}
.qs{font-family:-apple-system,sans-serif;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-left:0}
.btn svg,.prbtn svg,.seg button svg,.rec svg,.qbox .talk svg{flex:0 0 auto}
.cc svg{flex:0 0 auto}
.catbox > .hd .sq svg,.cc svg{stroke-width:2.1}
.sq-stop{width:14px;height:14px;border-radius:3px;background:#FFFDF6;display:inline-block}
.vplay svg{width:14px;height:14px}
.kv .v svg{vertical-align:-3px;margin-right:2px}
.blk{margin-bottom:0;padding:26px 0}
.blk + .blk{border-top:1.5px solid var(--rule)}
.sheet .blk:first-of-type{padding-top:6px}
.opts{display:flex;gap:8px}
.opt{flex:1;background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:12px 2px 10px;text-align:center;
  transition:.12s;display:flex;flex-direction:column;align-items:center;gap:2px}
.iblob{display:inline-flex;align-items:center;justify-content:center;color:#FFFDF7;flex:0 0 auto;vertical-align:-5px}
.iblob svg{fill:currentColor}
.opt .iblob{margin:0 auto 2px;display:flex}
.opt .l{font-size:12px;font-weight:800;color:var(--ink-2);margin-top:3px}
.opt.on{border-color:var(--plum);background:#F1EFFA;box-shadow:0 2px 7px rgba(38,48,43,.10)}
.opt.on .l{color:var(--ink)}
.opts.wrap{flex-wrap:wrap}
.opts.wrap .opt{flex:0 0 calc(33.333% - 5.5px)}
.search.scene{margin-top:12px;height:48px;font-size:16px;border-width:1.5px;border-color:var(--rule)}
.search.scene:focus{border-color:var(--plum);box-shadow:none}
.said{display:block;font-family:var(--hand);font-size:16px;line-height:1.3;color:var(--ink-2);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbox .lb{padding-top:2px}
.cover-pick{width:100%;display:flex;gap:13px;align-items:center;background:var(--card);border:1.5px solid var(--rule);
  border-radius:14px;padding:13px;text-align:left}
.cover-pick .box{width:64px;height:84px;flex:0 0 auto;border-radius:4px 7px 7px 4px;border:1.5px solid var(--edge);
  background:var(--paper);display:grid;place-items:center;font-size:22px;overflow:hidden}
.cover-pick .box img{width:100%;height:100%;object-fit:cover}
.cover-pick .t{font-family:var(--disp);font-size:15px}
.cover-pick .s{font-size:11.5px;color:var(--ink-2);font-weight:700;margin-top:2px;line-height:1.35}
.verdict{border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;margin-top:9px;line-height:1.35;border:1.5px solid}
.verdict.yes{background:#F9F1EC;border-color:rgba(193,95,60,.5);color:#8A4A2E}
.verdict.no{background:var(--card);border-color:var(--rule);color:var(--ink-2)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.sugg button{font-size:12.5px;font-weight:800;background:var(--card);border:1.5px solid var(--edge);border-radius:99px;padding:6px 12px}
.qbox{background:var(--plum-2);border:none;border-radius:var(--r);padding:19px;color:#FFFDF6}
.qbox .lb{font-size:10.5px;font-weight:800;letter-spacing:2px;color:rgba(255,253,246,.65)}
.qbox .txt{font-family:var(--hand);font-weight:700;font-size:25px;line-height:1.3;margin:8px 0 15px}
.qbox .btns{display:flex;gap:8px}
.qbox .talk{flex:1;height:46px;border-radius:12px;background:rgba(255,253,246,.14);color:#FFFDF6;
  font-family:var(--disp);font-size:15px;border:2px solid rgba(255,253,246,.4)}
.qbox .talk.on{background:#3FAE4E;color:#fff;border-color:transparent}
.ansIn{width:100%;height:48px;margin-bottom:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.12);color:#fff;padding:0 14px;outline:none;font-size:16px;font-family:var(--hand);font-weight:700}
.qn{font-size:10px;opacity:.65;margin-left:4px}
.qalist{margin-top:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.qa .qq{display:block;font-size:11px;color:rgba(255,255,255,.62);font-weight:700;line-height:1.35}
.qa .aa{display:block;font-size:17px;line-height:1.3;margin-top:1px}
.qa2{margin-top:7px}
.ansIn::placeholder{color:rgba(255,253,246,.55);font-family:-apple-system,sans-serif;font-size:13px;font-weight:700}
.ansIn:focus{border-color:#fff;background:rgba(255,253,246,.16)}
.qbox .swap{width:46px;height:46px;border-radius:12px;background:rgba(255,253,246,.14);color:#FFFDF6;font-size:17px;
  border:2px solid rgba(255,253,246,.4);flex:0 0 auto}
.memo{width:100%;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);padding:11px 13px;min-height:56px;
  outline:none;resize:none;font-family:var(--hand);font-size:21px;line-height:1.35}
.memo:focus{border-color:rgba(38,48,43,.42)}
details.parent{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:0 15px;margin:6px 0 0}
.blk + details.parent{margin-top:22px;border-top-color:var(--rule)}
.sheet .blk:last-of-type{padding-bottom:22px}
details.parent summary{list-style:none;padding:13px 0;font-size:13px;font-weight:800;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
details.parent summary span:first-child{display:flex;align-items:center;gap:6px}
details.parent summary::-webkit-details-marker{display:none}
details.parent[open] summary{border-bottom:1.5px dotted var(--rule);margin-bottom:13px}
details.parent .pad{padding-bottom:15px}
.savebar{position:sticky;bottom:0;z-index:4;padding:20px 0 calc(8px + var(--sb));margin-top:6px;
  background:linear-gradient(180deg,rgba(244,240,228,0) 0,var(--paper) 34%,var(--paper) 100%)}
.savebar .btn{height:58px;font-size:18px}
.ql{font-family:var(--disp);font-size:15px;margin:20px 0 9px;display:flex;align-items:center;gap:7px}
.ql:first-child,.ql.first{margin-top:0}
.ql svg{opacity:.5}
details.parent summary .chev{transition:transform .2s;color:var(--ink-2)}
details.parent[open] summary .chev{transform:rotate(180deg)}
details.parent .pad .memo{margin-bottom:2px}
.undo{width:100%;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink-2);padding:14px 0 2px;opacity:.75}
.big-cover{width:100%;border:1.5px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--paper);margin-bottom:16px}
.big-cover img{width:100%;display:block;max-height:42dvh;object-fit:contain}

.toast{position:fixed;left:50%;bottom:calc(112px + var(--sb));transform:translate(-50%,16px);z-index:90;
  background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 17px;font-size:14px;font-weight:800;
  opacity:0;transition:.28s;pointer-events:none;max-width:88%;text-align:center;border:1.5px solid var(--edge)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-14px;z-index:95;pointer-events:none;font-size:15px}
@keyframes drop{to{transform:translateY(105dvh) rotate(var(--rot));opacity:.1}}
.empty{text-align:center;color:var(--ink-2);font-size:13.5px;padding:30px 10px;font-weight:700;line-height:1.7}
.hidden{display:none!important}
@media (min-width:700px){
  #app{max-width:760px}
  nav.tabs{max-width:760px;padding:10px 8px calc(10px + var(--sb))}
  nav.tabs .lb{font-size:12px}
  .sheet{max-width:640px;border-radius:26px 26px 0 0}
  main{padding:22px 26px calc(112px + var(--sb))}
  .shelfrow .bks{grid-template-columns:repeat(5,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .srow{grid-template-columns:repeat(10,minmax(0,1fr))}
  .bank .big b{font-size:58px}
  .top h1{font-size:22px}
  .card,.plain,.catbox{border-radius:20px}
  .opts.wrap .opt{flex:0 0 calc(16.666% - 7px)}
}
@media (min-width:1000px){
  #app{max-width:860px}
  nav.tabs{max-width:860px}
  .shelfrow .bks{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

const KEY = "yuan-reading-bank-v2", OLD_KEY = "yuan-reading-quest-v1";
const meta = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(k); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async set(k, v){
    const s = JSON.stringify(v);
    try{ localStorage.setItem(k, s); }catch(e){ alert("저장 공간이 부족해요.\n배지 탭에서 백업을 저장한 뒤, 오래된 사진을 정리해 주세요."); }
    try{ if(window.storage) await window.storage.set(k, s); }catch(e){}
  }
};
const IDB = {
  db:null,
  open(){
    return new Promise(res => {
      if(this.db) return res(this.db);
      if(!window.indexedDB) return res(null);
      try{
        const rq = indexedDB.open("yuan-covers", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("covers");
        rq.onsuccess = () => { this.db = rq.result; res(this.db); };
        rq.onerror = () => res(null);
      }catch(e){ res(null); }
    });
  },
  async all(){
    const db = await this.open(); if(!db) return {};
    return new Promise(res => {
      const out = {}, cur = db.transaction("covers","readonly").objectStore("covers").openCursor();
      cur.onsuccess = e => { const c = e.target.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); };

function habaLookup(title){
  const n = norm(title);
  if(!n) return {book:null, ids:[], exact:false, must20:false};
  const all = BOOKS.filter(b => norm(b.title) === n);       // 두 분야 중복 수록 대응
  const exact = all[0];
  const near = exact || (n.length > 1 ? BOOKS.find(b => norm(b.title).includes(n) || n.includes(norm(b.title))) : null);
  return {book: exact || near || null, ids: all.map(b => b.id), exact: !!exact,
    must20: MUST20_SET.has(n) || MUST20.some(m => norm(m).includes(n) && n.length > 2)};
}
function suggest(title){
  const n = norm(title); if(!n) return [];
  const seen = new Set(), out = [];
  BOOKS.forEach(b => { const bn = norm(b.title); if(bn.includes(n) && !seen.has(bn)){ seen.add(bn); out.push(b); } });
  return out.slice(0,4);
}
const catsOf = e => {
  let ids = Array.isArray(e.categories) && e.categories.length ? e.categories.slice()
          : (e.category ? [e.category] : []);
  const hs = (e.habaIds && e.habaIds.length) ? e.habaIds : (e.habaId ? [e.habaId] : []);
  hs.forEach(h => { const c = BOOK(h).category; if(!ids.includes(c)) ids.push(c); });
  return ids.map(CAT).filter(Boolean);
};
const catOf = e => catsOf(e)[0] || null;
const habaIdsOf = e => (e.habaIds && e.habaIds.length) ? e.habaIds : (e.habaId ? [e.habaId] : []);

function stats(){
  const cat = {}; ALL_CATS.forEach(c => cat[c.id] = 0);
  const habaSet = new Set(), habaTitles = new Set(), mustSet = new Set(), favCount = {}, dates = [];
  let talked = 0, ratingSum = 0, rated = 0, photos = 0;
  S.entries.forEach(e => {
    habaIdsOf(e).forEach(h => { if(!habaSet.has(h)){ habaSet.add(h); cat[BOOK(h).category]++; habaTitles.add(norm(BOOK(h).title)); } });
    (e.categories||[]).forEach(c => { if(c === "eng" || c === "etc") cat[c] = (cat[c]||0) + 1; });
    if(e.must20) mustSet.add(norm(e.title));
    if(e.talked) talked++;
    if(e.rating){ ratingSum += e.rating; rated++; }
    if(e.favoriteType) favCount[e.favoriteType] = (favCount[e.favoriteType]||0)+1;
    if(e.hasCover) photos++;
    if(e.date) dates.push(e.date.slice(0,10));
  });
  const uniq = [...new Set(dates)].sort();
  let run = 0, best = 0, prev = null;
  uniq.forEach(d => { const t = new Date(d+"T00:00:00").getTime();
    run = (prev !== null && t - prev === 86400000) ? run+1 : 1; best = Math.max(best, run); prev = t; });
  const mk = new Date(), ym = mk.getFullYear()+"-"+pad(mk.getMonth()+1);
  // 어느 한 달을 하루도 빠짐없이 읽었는가
  const byMonth = {};
  uniq.forEach(d => { const m = d.slice(0,7); (byMonth[m] = byMonth[m] || new Set()).add(d); });
  const fullMonth = Object.keys(byMonth).some(m => {
    const [y, mo] = m.split("-").map(Number);
    return byMonth[m].size >= new Date(y, mo, 0).getDate();
  });
  const w0 = new Date(); w0.setDate(w0.getDate() - ((w0.getDay()+6) % 7));
  const wk = w0.getFullYear()+"-"+pad(w0.getMonth()+1)+"-"+pad(w0.getDate());
  const week = S.entries.filter(e => (e.date||"") >= wk).length;
  const rereads = S.entries.filter(e => (e.reads||1) > 1).length;
  const notes = S.entries.filter(e => e.hasNote).length;
  const voices = S.entries.filter(e => e.hasVoice).length;
  // 최근 연속(오늘/어제 기준)
  let cur = 0; { const set = new Set(uniq); let d = new Date();
    if(!set.has(today())) d.setDate(d.getDate()-1);
    for(;;){ const k = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      if(set.has(k)){ cur++; d.setDate(d.getDate()-1); } else break; } }
  return {week, rereads, notes, voices, cur, fullMonth, total:S.entries.length, haba: habaTitles.size,
    haba100: habaTitles.size, haba92: habaTitles.size, habaSet, cat, must:mustSet.size, talked, photos,
    avg: rated ? ratingSum/rated : 0, streak:best, days:uniq.length, favCount,
    month: S.entries.filter(e => (e.date||"").startsWith(ym)).length};
}

function compressImage(file, kind){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = (kind === "note" || kind === "noteRaw") ? 1000 : 900, sc = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ res(cv.toDataURL("image/jpeg", .82)); }catch(e){ rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지 오류")); };
    img.src = url;
  });
}

  {k:"new",   n:"최근 읽은 순"},

function sortEntries(list){
  const catIdx = e => { const c = catsOf(e)[0]; return c ? ALL_CATS.findIndex(x => x.id === c.id) : 99; };
  const byDate = (a,b) => (b.date||"").localeCompare(a.date||"");
  const arr = list.slice();
  if(shelfSort === "old")   arr.sort((a,b) => (a.date||"").localeCompare(b.date||""));
  else if(shelfSort === "title") arr.sort((a,b) => a.title.localeCompare(b.title, "ko"));
  else if(shelfSort === "cat")   arr.sort((a,b) => (catIdx(a) - catIdx(b)) || a.title.localeCompare(b.title, "ko"));
  else if(shelfSort === "rate")  arr.sort((a,b) => ((b.rating||0) - (a.rating||0)) || byDate(a,b));
  else arr.sort(byDate);
  return arr;
}

function shelfHTML(list){
  return shelfView === "spine" ? spineHTML(list) : coverHTML(list);
}
function spineHTML(list){
  const books = list.slice();
  const rows = Math.max(1, Math.ceil(books.length / 10));
  let out = "";
  for(let r = 0; r < rows; r++){
    const seg = books.slice(r*10, r*10 + 10);
    let cells = seg.map((e, i) => {
      const c = catOf(e);
      const col = c ? c.color : "#B9B2A0";
      const lt = c && LIGHT_CATS[c.id] ? " lt" : "";
      const h = 88 + ((parseInt(String(e.id).replace(/\D/g,"").slice(-2) || (i+7), 10) % 5) * 6);
      const title = e.title.length > 10 ? e.title.slice(0,10) + "…" : e.title;
      const hb = habaIdsOf(e).length ? " hasHb" : "";
      const rx = (e.reads||1) > 1 ? " hasRx" : "";
      return `<button class="sp${lt}${hb}${rx}" data-entry="${e.id}" style="background:${col};height:${h}px;color:#FFFDF6"
        title="${esc(e.title)}"><span class="t">${esc(title)}</span>${hb?`<span class="hb">HABA</span>`:""}${rx?`<span class="rx3">×${e.reads}</span>`:""}</button>`;
    }).join("");
    const empty = 10 - seg.length;
    if(empty > 0 && (r === rows - 1)) for(let i = 0; i < empty; i++) cells += `<span class="sp gap" style="height:${72 + (i%3)*5}px"></span>`;
    out += `<div class="srow">${cells}</div><div class="plank2"></div>
      <div class="shelflab"><span>${r+1}번 칸</span><span>${seg.length} / 10${seg.length===10?` · 가득 찼어요 ${ic("star",13,2.2)}`:""}</span></div>`;
  }
  return `<div class="case">${out}</div>
    <p style="font-size:11.5px;color:var(--ink-2);font-weight:700;text-align:center;margin:0 0 4px">
      한 칸에 10권씩 꽂혀요 · 책등을 누르면 기록이 열려요</p>`;
}
function coverHTML(list){
  if(!list.length) return `<div class="plain"><div class="empty">책장이 비었어요.<br>표지를 찍으면 여기에 꽂혀요</div></div>`;
  let out = "";
  for(let i=0;i<list.length;i+=3){
    const row = list.slice(i,i+3);
    out += `<div class="shelfrow"><div class="bks">${row.map(e => {
      const img = coverImg(e);
      const hid = habaIdsOf(e)[0];
      const c0 = catOf(e);
      const col = c0 ? c0.color : "var(--ink-2)";
      return `<button class="bk" data-entry="${e.id}">
        <span class="ph">
          ${img || `<span class="band" style="background:${col}"></span><span class="tt">${esc(e.title)}</span>`}
          ${hid ? `<span class="hb">HABA</span>` : ""}
          ${e.hasCover ? "" : `<span class="add">${ic("camera",11,2.4)}</span>`}
          ${(e.reads||1)>1 ? `<span class="rx2">×${e.reads}</span>` : ""}
        </span>
        <span class="nm">${esc(e.title)}</span>
        <span class="dt">${c0?esc(c0.short)+" · ":""}${esc((e.date||"").slice(5).replace("-","."))}</span>
      </button>`;
    }).join("")}</div><div class="plank"></div></div>`;
  }
  return out;
}

/* ---- 기록 ---- */
function rowPB(e){
  const img = coverImg(e);
  const hid = habaIdsOf(e)[0];
  const tag = hid ? `<i class="pill haba">HABA ${pad3(hid)}</i>` : `<i class="pill my">내 책</i>`;
  const cs = catsOf(e);
  const sub2 = cs.length ? cs.map(c => c.short).join(" · ") : "분야 없음";
  const twin = S.entries.filter(x => norm(x.title) === norm(e.title)).length > 1;
  const meta = [sub2];
  if(e.must20) meta.push("필독20");
  if((e.reads||1) > 1) meta.push(e.reads + "번 읽음");
  if(e.talked) meta.push("이야기함");
  if(e.hasNote) meta.push("스캔");
  if(answersOf(e).length) meta.push("대답 " + answersOf(e).length);
  if(e.readWith) meta.push(RW(e.readWith).l.replace(" 읽었어요","").replace(" 주었어요"," 읽어줌"));
  if(twin) meta.push("기록 중복");
  return `<button class="pbrow" data-entry="${e.id}">
    <span class="th">${img || ic("book",16,2)}</span>
    <span class="m">
      <span class="t">${esc(e.title)}</span>
      <span class="s">${tag}${esc(meta.join(" · "))}</span>
      ${(e.sceneNote || answersOf(e)[0]) ? `<span class="said">“${esc(e.sceneNote || answersOf(e)[0].a)}”</span>` : ""}
    </span>
    <span class="rt">
      ${e.hasVoice ? `<span class="vplay" data-play="${e.id}" role="button" aria-label="녹음 듣기">${ic("mic",14,2.3)}</span>` : ""}
      ${e.rating ? rateBlob(e.rating, 24) : ""}
      ${stampHTML(e.date, true)}
    </span>
  </button>`;
}

function habaGroups(){
  const read = stats().habaSet;
  let groups;
  if(habaFilter === "must"){
    groups = [{key:"must", name:"초1 입학 전 꼭 읽어볼 20권", icon:"flag", color:"#C15F3C", must:true,
      list: MUST20.map((t, i) => {
        const b = BOOKS.find(x => norm(x.title) === norm(t));
        return {id: b.id, no: i+1, title: t, must20: true, category: b.category, inHaba: !b.extra};
      })}];
  } else {
    groups = HABA_CATS.filter(c => habaFilter === "all" || habaFilter === c.id)
      .map(c => ({key:c.id, name:c.name, icon:c.icon, color:c.color, list: BOOKS.filter(b => b.category === c.id)}));
  }
  const hq = norm(habaQ);
  if(hq){ groups = groups.map(g => Object.assign({}, g, {list: g.list.filter(b => norm(b.title).includes(hq))}))
                         .filter(g => g.list.length); }
  return {groups, read};
}

  const {groups, read} = habaGroups();

  return groups.map(g => {

    return `<section class="catbox">
      <div class="hd" style="border-bottom:1.5px dotted var(--rule)">
        <span class="sq" style="background:${g.color}22;color:${g.color}">${cicon(g,19)}</span>
        <span class="nm">${g.name}</span>
        <span class="ct">${g.must ? MUST20.filter(t => S.entries.some(e => norm(e.title) === norm(t))).length : n} / ${g.list.length}</span>

        return `<button class="tl ${on?'on':''}" ${b.id?`data-haba="${b.id}"`:`data-title="${esc(b.title)}"`}>
          <span class="t">${g.must?`<b class="tno">${b.no}</b> `:""}${esc(b.title)}</span>

}

function listSection(o){
  const all = o.items;
  const months = [...new Set(all.map(e => (e.date||"").slice(0,7)).filter(Boolean))].sort().reverse();
  const filtered = (o.open && o.month !== "all") ? all.filter(e => (e.date||"").startsWith(o.month)) : all;
  const shown = o.open ? filtered : filtered.slice(0, 10);
  const rest = filtered.length - shown.length;
  return `
  <div class="sec"><h2>${o.title}</h2><span class="ln"></span><span>${all.length}개</span></div>
  <section class="plain">
    ${!all.length ? `<div class="empty">${o.empty}</div>` : `
      ${o.open && months.length > 1 ? `<div class="chips wrapped tight" style="padding-bottom:6px">
        <button class="chip ${o.month==='all'?'on':''}" data-mf="${o.key}:all">전체 ${all.length}</button>
        ${months.map(m => `<button class="chip ${o.month===m?'on':''}" data-mf="${o.key}:${m}">${+m.slice(5,7)}월 ${all.filter(e=>(e.date||"").startsWith(m)).length}</button>`).join("")}
      </div>` : ""}
      ${shown.map(o.row).join("") || `<div class="empty">이 달에는 기록이 없어요</div>`}
      ${(!o.open && rest > 0) ? `<button class="moreBtn" data-more="${o.key}">더 보기 (${rest}개 더) ▾</button>` : ""}
      ${o.open ? `<button class="moreBtn" data-more="${o.key}">접기 ▴</button>` : ""}`}
  </section>`;
}

/* ---------- 사진 크롭 ---------- */
let crop = null;
const RATIOS = [{k:"3:4", r:3/4, n:"표지"},{k:"1:1", r:1, n:"정사각"},{k:"4:3", r:4/3, n:"가로"}];
function openCrop(src, kind){
  const img = new Image();
  img.onload = () => {
    crop = {src, kind, img, ratio: kind === "note" ? 4/3 : 3/4, scale:1, x:0, y:0, W:0, H:0, base:1};
    $("cropLayer").classList.add("show");
    document.body.style.overflow = "hidden";
    paintCrop();
    requestAnimationFrame(() => { fitCrop(); requestAnimationFrame(fitCrop); });
  };
  img.onerror = () => toast("사진을 열 수 없어요");
  img.src = src;
}
function paintCrop(){
  const c = crop; if(!c) return;
  $("cropLayer").innerHTML = `
    <div class="ch"><b>${c.kind === "note" ? "독서통장·기록장 자르기" : "표지 자르기"}</b><span>끌어서 위치 · 아래에서 크기</span></div>
    <div class="cropbox"><div class="cropframe" id="cropFrame"><img id="cropImg" src="${c.src}"><span class="gridln"></span></div></div>
    <div class="croptools">
      <div class="ratios">${RATIOS.map(r => `<button data-ratio="${r.k}" class="${Math.abs(c.ratio-r.r)<0.01?'on':''}">${r.n}</button>`).join("")}</div>
      <div class="zoom">${ic("search",17,2.1)}<input type="range" id="cropZoom" min="100" max="320" value="${Math.round(c.scale*100)}"></div>
      <div class="acts"><button class="no" id="cropCancel">취소</button><button class="ok" id="cropOk">이대로 쓰기</button></div>
    </div>`;
  bindCrop();
}
function fitCrop(){
  const c = crop; if(!c) return;
  const box = document.querySelector(".cropbox"); const fr = $("cropFrame");
  if(!box || !fr) return;
  const bw = box.clientWidth || (window.innerWidth - 36), bh = box.clientHeight || Math.round(window.innerHeight * .5);
  if(bw < 60) { requestAnimationFrame(fitCrop); return; }
  let W = bw, H = W / c.ratio;
  if(H > bh){ H = bh; W = H * c.ratio; }
  c.W = W; c.H = H;
  fr.style.width = W + "px"; fr.style.height = H + "px";
  c.base = Math.max(W / c.img.width, H / c.img.height);
  c.x = (W - c.img.width * c.base * c.scale) / 2;
  c.y = (H - c.img.height * c.base * c.scale) / 2;
  applyCrop();
}
function applyCrop(){
  const c = crop, im = $("cropImg"); if(!c || !im) return;
  const eff = c.base * c.scale;
  const w = c.img.width * eff, h = c.img.height * eff;
  c.x = Math.min(0, Math.max(c.W - w, c.x));
  c.y = Math.min(0, Math.max(c.H - h, c.y));
  im.style.transform = `translate(${c.x}px,${c.y}px) scale(${eff})`;
}
function bindCrop(){
  const fr = $("cropFrame"); if(!fr) return;
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  fr.addEventListener("touchstart", ev => { on = true; sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; ox = crop.x; oy = crop.y; }, {passive:true});
  fr.addEventListener("touchmove", ev => { if(!on) return;
    crop.x = ox + (ev.touches[0].clientX - sx); crop.y = oy + (ev.touches[0].clientY - sy); applyCrop(); }, {passive:true});
  fr.addEventListener("touchend", () => { on = false; });
  fr.addEventListener("mousedown", ev => { on = true; sx = ev.clientX; sy = ev.clientY; ox = crop.x; oy = crop.y; });
  window.addEventListener("mousemove", ev => { if(!on) return; crop.x = ox + (ev.clientX - sx); crop.y = oy + (ev.clientY - sy); applyCrop(); });
  window.addEventListener("mouseup", () => { on = false; });
  const z = $("cropZoom");
  if(z) z.addEventListener("input", () => {
    const old = crop.scale, ns = +z.value / 100;
    const cx = crop.W/2, cy = crop.H/2;
    crop.x = cx - (cx - crop.x) * (ns/old);
    crop.y = cy - (cy - crop.y) * (ns/old);
    crop.scale = ns; applyCrop();
  });
}
function cropResult(){
  const c = crop;
  const outW = c.kind === "note" ? 700 : 520;
  const outH = Math.round(outW / c.ratio);
  const cv = document.createElement("canvas"); cv.width = outW; cv.height = outH;
  const k = outW / c.W, eff = c.base * c.scale;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,outW,outH);
  ctx.drawImage(c.img, c.x*k, c.y*k, c.img.width*eff*k, c.img.height*eff*k);
  return cv.toDataURL("image/jpeg", c.kind === "note" ? .72 : .68);
}
function closeCrop(){
  crop = null; $("cropLayer").classList.remove("show"); $("cropLayer").innerHTML = "";
  document.body.style.overflow = draft ? "hidden" : "";
}

/* ---------- 음성 기록 ---------- */
let mediaRec = null, recChunks = [], recTimer = null, recSec = 0, recStream = null;
function recLabel(){
  const b = $("recBtn");
  if(b){
    b.innerHTML = mediaRec ? `<span class="sq-stop"></span><span>녹음 중 ${recSec}초 · 눌러서 끝내기</span>`
                           : `${ic("mic",21,2)}<span>${esc(nmI())} 목소리로 남기기</span>`;
    b.classList.toggle("on", !!mediaRec);
  }
}
async function toggleRec(){
  if(mediaRec){ try{ mediaRec.stop(); }catch(e){} return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("이 브라우저에서는 녹음이 안 돼요"); return; }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const type = ["audio/mp4","audio/webm"].find(t => window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    mediaRec = type ? new MediaRecorder(recStream, {mimeType:type}) : new MediaRecorder(recStream);
    recChunks = []; recSec = 0;
    mediaRec.ondataavailable = ev => { if(ev.data && ev.data.size) recChunks.push(ev.data); };
    mediaRec.onstop = () => {
      clearInterval(recTimer); recTimer = null;
      const blob = new Blob(recChunks, {type: mediaRec.mimeType || "audio/mp4"});
      if(recStream) recStream.getTracks().forEach(t => t.stop());
      mediaRec = null; recStream = null;
      const fr = new FileReader();
      fr.onload = () => { if(!draft) return; draft.voice = fr.result; draft.hasVoice = true; paintSheet(); toast("🎤 목소리를 담았어요"); };
      fr.readAsDataURL(blob);
    };
    mediaRec.start();
    recLabel();
    recTimer = setInterval(() => { recSec++; recLabel(); if(recSec >= 90 && mediaRec) mediaRec.stop(); }, 1000);
  }catch(err){ toast("마이크 권한이 필요해요"); mediaRec = null; }
}

document.addEventListener("click", async e => {
  const d = e.target.closest("[data-dlg]");
  if(d){ closeDlg(+d.dataset.dlg); return; }
  const dl = $("dlg");
  if(dl && dl.classList.contains("show") && e.target === dl){ closeDlg(-1); return; }
  const t = e.target.closest("[data-tab],[data-entry],[data-haba],[data-title],[data-hf],[data-sf],[data-scf],[data-more],[data-mf],[data-bl],[data-ratio],[data-dlg],[data-rate],[data-fav],[data-pick],[data-print],[data-cc],[data-sv],[data-read],[data-rw],[data-day],[data-play],#recBtn,#delVoice,#cropOk,#cropCancel,#newEntry,#closeSheet,#pickCover,#delCover,#pickNote,#delNote,#talkBtn,#qSwap,#saveBtn,#delEntry,[data-adult],#openPrint,#openSet,#saveProfile,#startProfile,#doExport,#doExportLite,#doShare,#doImport,#doReset,#scrim");
  if(!t) return;
  if(t.id === "scrim" || t.id === "closeSheet"){ closeSheet(); return; }
  if(t.id === "cropCancel"){ closeCrop(); return; }
  if(t.dataset.ratio){
    const r = RATIOS.find(x => x.k === t.dataset.ratio); if(!r || !crop) return;
    crop.ratio = r.r; crop.scale = 1; paintCrop(); requestAnimationFrame(fitCrop); return;
  }
  if(t.id === "cropOk"){
    if(!crop || !draft){ closeCrop(); return; }
    const kind = crop.kind, out = cropResult();
    if(kind === "note"){ draft.note = out; draft.hasNote = true; }
    else { draft.cover = out; draft.hasCover = true; }
    closeCrop(); paintSheet();
    toast(kind === "note" ? "스캔을 담았어요" : "표지를 담았어요");
    return;
  }
  if(t.dataset.print){
    const k = t.dataset.print;
    if(k === "entry" && draft){
      const authEl = $("aIn"), tEl = $("tIn");
      doPrint(sheetBlank(Object.assign({}, draft, {title: tEl?tEl.value.trim():draft.title, author: authEl?authEl.value.trim():""})));
    }
    else if(k === "blank1") doPrint(sheetBlank(null));
    else if(k === "list") doPrint(sheetList());
    else if(k === "haba") doPrint(sheetHaba());
    return;
  }
  if(t.dataset.tab){ S.tab = t.dataset.tab; render(); return; }
  if(t.id === "newEntry"){ openNew(null); return; }
  if(t.dataset.play){
    e.stopPropagation();
    const src = COVERS[t.dataset.play + "::voice"];
    if(!src){ toast("녹음을 찾을 수 없어요"); return; }
    if(!window.__au) window.__au = new Audio();
    const au = window.__au;
    if(au.__id === t.dataset.play && !au.paused){ au.pause(); document.querySelectorAll(".vplay").forEach(x=>x.classList.remove("on")); return; }
    au.src = src; au.__id = t.dataset.play;
    document.querySelectorAll(".vplay").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    au.onended = () => t.classList.remove("on");
    au.play().catch(()=>toast("재생할 수 없어요"));
    return;
  }
  if(t.dataset.entry){ openEntry(t.dataset.entry); return; }
  if(t.dataset.hf){ habaFilter = t.dataset.hf; render(); return; }
  if(t.dataset.title){
    const ti = t.dataset.title;
    const ex = S.entries.find(x => norm(x.title) === norm(ti));
    if(ex) openEntry(ex.id);
    else { draft = newDraft(null); draft.title = ti; draft.must20 = true; paintSheet(true); }

    else { memoOpen = !memoOpen; if(!memoOpen) memoMonth = "all"; }
    render(); return;

    const [k, m] = t.dataset.mf.split(":");

    render(); return;
  }

  if(draft){
    if(t.dataset.pick){
      const b = BOOK(+t.dataset.pick), lk = habaLookup(b.title);
      draft.title = b.title; draft.habaId = b.id; draft.habaIds = lk.ids; draft.must20 = b.must20;
      draft.categories = [...new Set((draft.categories||[]).concat(lk.ids.map(i => BOOK(i).category)))]; syncCatChips();
      const el = $("tIn"); if(el) el.value = b.title;
      $("tCheck").innerHTML = checkHTML();
      return;
    }
    if(t.id === "pickCover"){ pickTarget = "cover"; $("camIn").click(); return; }
    if(t.id === "delCover"){ e.stopPropagation(); draft.cover = null; draft.hasCover = false; paintSheet(); return; }

      draft.date = dayAgo(+t.dataset.day);
      const di = $("dIn"); if(di) di.value = draft.date;
      document.querySelectorAll("[data-day]").forEach(el => el.classList.toggle("on", el.dataset.day === t.dataset.day));
      return;
    }
    if(t.dataset.rw){
      draft.readWith = draft.readWith === t.dataset.rw ? null : t.dataset.rw;
      document.querySelectorAll("[data-rw]").forEach(el => el.classList.toggle("on", el.dataset.rw === draft.readWith));

        draft.categories.splice(i,1);
      } else draft.categories.push(id);
      syncCatChips(); return;
    }
    if(t.id === "pickNote"){ pickTarget = "note"; $("camIn").click(); return; }
    if(t.id === "recBtn"){ toggleRec(); return; }
    if(t.id === "delVoice"){ draft.voice = null; draft.hasVoice = false; paintSheet(); return; }

      return;
    }
    if(t.id === "qSwap"){
      const qs = questionsFor(draft.habaId ? BOOK(draft.habaId).title : draft.title);
      draft.qIndex = ((draft.qIndex||0)+1) % qs.length;
      paintSheet();
      return;
    }
    if(t.id === "saveBtn"){
      const title = ($("tIn").value || "").trim();
      if(!title){ toast("책 제목을 적어주세요"); $("tIn").focus(); return; }
      const lk = habaLookup(title), memoEl = $("memo"), dateEl = $("dIn");
      const authEl = $("aIn");
      const rec = {id:draft.id, title, author: authEl ? authEl.value.trim() : (draft.author||""), category: draft.category || null,
        reads: draft.reads || 1, categories: (draft.categories||[]).slice(), readWith: draft.readWith || null, sceneNote: (($("sceneIn")||{}).value || draft.sceneNote || "").trim(),
        answers: (draft.answers || []).filter(x => x.a && x.a.trim()).map(x => ({q:x.q, a:x.a.trim()})),
        date:(dateEl && dateEl.value) || draft.date || today(),
        rating:draft.rating, favoriteType:draft.favoriteType, talked:draft.talked,
        memo: memoEl ? memoEl.value.trim() : (draft.memo||""),
        habaId: lk.exact ? lk.book.id : null, habaIds: lk.exact ? lk.ids : [],
        must20: lk.exact ? lk.book.must20 : !!lk.must20, hasCover: !!draft.cover, hasNote: !!draft.note, hasVoice: !!draft.voice, qIndex: draft.qIndex};
      const wasNew = draft.isNew;
      if(wasNew){
        const dup = S.entries.find(x => norm(x.title) === norm(title));
        if(dup){
          const r = await ask({title:"이미 기록한 책이에요",
            desc:`${dup.title} — 지금까지 ${dup.reads||1}번 읽음`,
            buttons:[{label:"다시 읽기로 합치기", tone:"ok"},{label:"따로 새로 기록하기"},{label:"취소"}]});
          if(r.index === 2 || r.index === -1) return;
          if(r.index === 0){
            dup.reads = Math.min(5, (dup.reads||1) + 1);
            dup.date = rec.date;
            if(rec.rating) dup.rating = rec.rating;
            if(rec.favoriteType) dup.favoriteType = rec.favoriteType;
            if(rec.talked) dup.talked = true;
            if(rec.sceneNote) dup.sceneNote = rec.sceneNote;
            if(rec.memo) dup.memo = rec.memo;
            if(rec.author) dup.author = rec.author;
            if(draft.cover){ COVERS[dup.id] = draft.cover; dup.hasCover = true; await IDB.put(dup.id, draft.cover); }
            if(draft.note){ COVERS[dup.id+"::note"] = draft.note; dup.hasNote = true; await IDB.put(dup.id+"::note", draft.note); }
            if(draft.voice){ COVERS[dup.id+"::voice"] = draft.voice; dup.hasVoice = true; await IDB.put(dup.id+"::voice", draft.voice); }
            S.entries.sort((a,b) => (b.date||"").localeCompare(a.date||""));
            save(); checkBadges(); save(); closeSheet(); render();
            stampHit("또 읽음"); setTimeout(()=>toast(`${dup.title} · ${dup.reads}번째 읽음`), 700);
            return;
          }
        }
      }
      if(draft.cover){ COVERS[rec.id] = draft.cover; await IDB.put(rec.id, draft.cover); }
      else { delete COVERS[rec.id]; await IDB.del(rec.id); }
      const nk = rec.id + "::note", vk = rec.id + "::voice";
      if(draft.note){ COVERS[nk] = draft.note; await IDB.put(nk, draft.note); }
      else { delete COVERS[nk]; await IDB.del(nk); }
      if(draft.voice){ COVERS[vk] = draft.voice; await IDB.put(vk, draft.voice); }
      else { delete COVERS[vk]; await IDB.del(vk); }
      const i = S.entries.findIndex(x => x.id === rec.id);
      if(i >= 0) S.entries[i] = rec; else S.entries.push(rec);
      S.entries.sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.id > a.id ? 1 : -1));
      save(); checkBadges(); save();
      closeSheet(); render();
      if(wasNew){ stampHit("읽음"); const n = stats().total;
        setTimeout(()=>toast(rec.habaIds.length ? `${n}권째 · HABA 100선 도장!` : `${n}권째 도장을 찍었어요`), 700); }
      else toast("기록을 저장했어요");
      return;
    }
    if(t.id === "delEntry"){
      const c = await ask({title:"이 기록을 지울까요?", desc:`${draft.title || "제목 없음"}\n사진·녹음도 함께 사라져요.`,
        buttons:[{label:"그대로 두기"},{label:"기록 지우기", tone:"danger"}]});
      if(c.index !== 1) return;
      await IDB.del(draft.id); delete COVERS[draft.id];
      await IDB.del(draft.id+"::note"); delete COVERS[draft.id+"::note"];
      await IDB.del(draft.id+"::voice"); delete COVERS[draft.id+"::voice"];
      S.entries = S.entries.filter(x => x.id !== draft.id);
      save(); checkBadges(); save(); closeSheet(); render(); toast("기록을 삭제했어요");
      return;
    }
  }

  if(t.id === "doShare"){
    const name = `${nm()}-독서기록-${today()}.html`;
    const blob = new Blob([shareHTML()], {type:"text/html"});
    try{
      const file = new File([blob], name, {type:"text/html"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:nmI()+"의 독서기록", text:"열어보면 기록이 보이고, 앱의 ‘백업 불러오기’로 열면 그대로 옮겨져요"});
        toast("보냈어요 · 받은 사람은 백업 불러오기로 열면 돼요"); return;
      }
    }catch(err){ if(err && err.name === "AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast("HTML 파일로 저장했어요"); return;
  }
  if(t.id === "doExport" || t.id === "doExportLite"){
    const lite = t.id === "doExportLite";
    const data = JSON.stringify({app:"yuan-reading-bank", version:3, exportedAt:new Date().toISOString(),
      entries:S.entries, badges:S.badges, profile:S.profile, covers: lite ? {} : COVERS});
    const name = `${nm()}-독서기록-${today()}${lite?"-가벼운":""}.json`;
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast(lite ? "🪶 가벼운 백업을 저장했어요" : "💾 전체 백업을 저장했어요"); return;
  }
  if(t.id === "openPrint"){
    const r = await ask({title:"인쇄하기", desc:"A4 한 장으로 나와요",
      buttons:[{label:"빈 독서기록장 1장", tone:"ok"},{label:"독서기록 전체 목록"},{label:"HABA 추천도서 체크리스트"},{label:"취소"}]});
    if(r.index === 0) doPrint(sheetBlank(null));
    else if(r.index === 1) doPrint(sheetList());
    else if(r.index === 2) doPrint(sheetHaba());
    return;
  }
  if(t.id === "openSet"){ S.tab = "badge"; render();
    setTimeout(()=>{ const el = $("settings"); if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 120); return; }
  if(t.dataset.adult){
    const typed = (($("firstChild")||{}).value || ($("setChild")||{}).value || "").trim();
    S.profile = Object.assign({}, S.profile, {adult: t.dataset.adult});
    if(typed) S.profile.child = typed.slice(0,8);
    save(); render();
    if(S.tab === "badge") setTimeout(()=>{ const el = $("settings"); if(el && el.scrollIntoView) el.scrollIntoView({block:"start"}); }, 60);
    return;
  }
  if(t.id === "startProfile"){
    const c = (($("firstChild")||{}).value || "").trim().slice(0,8);
    if(!c){ toast("아이 이름을 적어주세요"); return; }
    S.profile = {child:c, adult: ad(), set:true};
    save(); render(); confetti(false);
    toast(`${nmI()}의 독서 기록을 시작해요`);
    return;
  }
  if(t.id === "saveProfile"){
    const c = ($("setChild").value || "").trim().slice(0,8);
    const a = ($("setAdult").value || "").trim().slice(0,6);
    if(!c){ toast("아이 이름을 적어주세요"); return; }
    S.profile = {child:c, adult: a || "엄마", set:true};
    save(); render();
    toast(`${nmI()}의 수첩으로 바꿨어요`);
    return;
  }
  if(t.id === "doImport"){ $("fileIn").click(); return; }
  if(t.id === "doReset"){
    const a = await ask({title:"어른 확인", desc:"99 × 99 = ?", input:true, inputType:"number",
      placeholder:"답을 적어주세요", buttons:[{label:"취소"},{label:"확인", tone:"ok"}]});
    if(a.index !== 1) return;
    if((a.value||"").replace(/[^0-9]/g,"") !== "9801"){ toast("숫자가 달라요. 기록은 안전해요"); return; }
    const c = await ask({title:"정말 지울까요?", desc:"모든 기록과 사진·녹음이 사라져요.\n되돌릴 수 없어요.",
      buttons:[{label:"그대로 두기"},{label:"모두 지우기", tone:"danger"}]});
    if(c.index !== 1) return;
    for(const k of Object.keys(COVERS)) await IDB.del(k);
    S.entries = []; S.badges = []; COVERS = {};
    save(); render(); toast("기록을 모두 지웠어요"); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "tIn" && draft){
    draft.title = e.target.value;
    const lk = habaLookup(draft.title);
    draft.habaId = lk.exact ? lk.book.id : null;
    draft.habaIds = lk.exact ? lk.ids : [];
    if(lk.exact){ draft.categories = [...new Set((draft.categories||[]).concat(lk.ids.map(i => BOOK(i).category)))]; syncCatChips(); }
    const box = $("tCheck"); if(box) box.innerHTML = checkHTML();
    return;
  }
  if(e.target.id === "memo" && draft){ draft.memo = e.target.value; return; }
  if(e.target.id === "aIn" && draft){ draft.author = e.target.value; return; }
  if(e.target.id === "firstChild" || e.target.id === "setChild"){
    S.profile = Object.assign({}, S.profile, {child: e.target.value.trim().slice(0,8)});
    return;
  }
  if(e.target.id === "sceneIn" && draft){ draft.sceneNote = e.target.value; return; }
  if(e.target.id === "ansIn" && draft){
    const qs = questionsFor(draft.habaId ? BOOK(draft.habaId).title : draft.title);
    const cq = qs[(draft.qIndex||0) % qs.length];
    draft.answers = (draft.answers || []).filter(x => x.q !== cq);
    if(e.target.value.trim()) draft.answers.push({q:cq, a:e.target.value});
    return;
  }
  if(e.target.id === "habaSearch"){
    habaQ = e.target.value;
    const box = $("habaList"); if(box) box.innerHTML = habaListHTML();
    return;
  }
  if(e.target.id === "bankSearch"){
    bankQ = e.target.value;
    const box = $("bankList"); if(box) box.innerHTML = bankListHTML();
    return;
  }
  if(e.target.id === "shelfSearch"){
    shelfQ = e.target.value;
    const q = norm(shelfQ);
    let list = S.entries.slice();
    if(shelfFilter === "haba") list = list.filter(x => habaIdsOf(x).length);
    if(shelfFilter === "my")   list = list.filter(x => !habaIdsOf(x).length);
    if(shelfFilter === "photo")list = list.filter(x => x.hasCover);
    if(q) list = list.filter(x => norm(x.title).includes(q) || norm(x.author||"").includes(q));
    const g = $("shelfGrid"); if(g) g.innerHTML = shelfHTML(sortEntries(list));
  }
});

document.addEventListener("change", async e => {
  if(e.target.id === "shelfSort"){ shelfSort = e.target.value; render(); return; }
  if(e.target.id === "camIn"){
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if(!f || !draft) return;
    toast("사진을 준비하고 있어요…");
    try{
      const raw = await compressImage(f, pickTarget === "note" ? "noteRaw" : "coverRaw");
      openCrop(raw, pickTarget);
    }
    catch(err){ toast("사진을 읽을 수 없어요"); }
    return;
  }
  if(e.target.id === "fileIn"){
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if(!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try{
        let raw = fr.result;
        const m = String(raw).match(/<script type="application\/json" id="reading-data">([\s\S]*?)<\/script>/);
        if(m) raw = m[1].replace(/\\u003c/g, "<");
        const d = JSON.parse(raw);
        if(!d || !Array.isArray(d.entries)) throw new Error("형식 오류");
        S.entries = d.entries; S.badges = Array.isArray(d.badges) ? d.badges : [];
        if(d.profile && d.profile.child) S.profile = Object.assign({set:true}, d.profile);
        if(d.covers && Object.keys(d.covers).length){
          COVERS = d.covers;
          for(const k of Object.keys(COVERS)) await IDB.put(k, COVERS[k]);
        }
        save(); checkBadges(); save(); render(); toast("📂 기록을 불러왔어요");
      }catch(err){ toast("파일을 읽을 수 없어요"); }
    };
    fr.readAsText(f);
  }
});

async function showUsage(){
  const el = $("usage"); if(!el) return;
  let mb = 0;
  try{ Object.values(COVERS).forEach(v => mb += (v||"").length * 0.75); }catch(e){}
  let quota = "";
  try{ if(navigator.storage && navigator.storage.estimate){
    const q = await navigator.storage.estimate();
    if(q && q.quota) quota = " / " + Math.round(q.quota/1048576) + "MB 가능";
  } }catch(e){}
  const n = Object.keys(COVERS).length;
  el.textContent = `${(mb/1048576).toFixed(1)}MB${quota} · 첨부 ${n}개`;
}

/* 시트를 아래로 밀어서 닫기 */
(function(){
  const sh = () => $("sheet");
  let y0 = null, dy = 0;
  document.addEventListener("touchstart", ev => {
    const el = sh(); if(!draft || !el || !el.contains(ev.target)) return;
    if(el.scrollTop > 2) { y0 = null; return; }
    y0 = ev.touches[0].clientY; dy = 0;
  }, {passive:true});
  document.addEventListener("touchmove", ev => {
    if(y0 === null) return;
    dy = ev.touches[0].clientY - y0;
    const el = sh(); if(!el) return;
    if(dy > 0){ el.style.transition = "none"; el.style.transform = `translateY(${dy}px)`; }
  }, {passive:true});
  document.addEventListener("touchend", () => {
    const el = sh(); if(y0 === null || !el) return;
    el.style.transition = "";
    if(dy > 110) closeSheet(); else el.style.transform = "";
    y0 = null; dy = 0;
  });
})();

async function migrate(){
  const old = await meta.get(OLD_KEY);
  if(!old || !old.books) return false;
  const out = [];
  Object.keys(old.books).forEach(k => {
    const r = old.books[k], b = BOOK(+k);
    if(!r || !r.completed || !b) return;
    const lk = habaLookup(b.title);
    out.push({id:"e"+k+"m", title:b.title, date:r.readDate||today(), rating:r.rating||0,
      favoriteType:r.favoriteType||null, talked:!!r.talked, memo:r.parentMemo||"",
      habaId:b.id, habaIds:lk.ids, must20:b.must20, hasCover:false, qIndex:r.qIndex||0});
  });
  (old.custom||[]).forEach(c => {
    const lk = habaLookup(c.title);
    out.push({id:c.id, title:c.title, date:c.date||today(), rating:c.rating||0, favoriteType:null,
      talked:false, memo:"", habaId: lk.exact?lk.book.id:null, habaIds: lk.exact?lk.ids:[],
      must20: lk.exact?lk.book.must20:!!lk.must20, hasCover:false, qIndex:0});
  });
  if(!out.length) return false;
  S.entries = out;
  return true;

function checkFonts(){
  const mark = ok => { try{ document.body.classList.toggle("nofont", !ok); }catch(e){} };
  try{
    if(!document.fonts || !document.fonts.check){ mark(false); return; }
    document.fonts.ready.then(() => mark(document.fonts.check('16px "Gowun Dodum"'))).catch(() => mark(false));
    setTimeout(() => { try{ mark(document.fonts.check('16px "Gowun Dodum"')); }catch(e){ mark(false); } }, 2500);
  }catch(e){ mark(false); }
}
(async function init(){
  checkFonts();
  const saved = await meta.get(KEY);
  if(saved && Array.isArray(saved.entries)){
    S.entries = saved.entries; S.badges = Array.isArray(saved.badges) ? saved.badges : [];
    if(saved.profile && saved.profile.child) S.profile = Object.assign({set:true}, saved.profile);
  } else if(await migrate()){ save(); }
  // 예전에 기록한 책도 현재 HABA 목록과 다시 연결 (필독 8권 추가분 반영)
  let relinked = 0;
  S.entries.forEach(e => {
    if(!Array.isArray(e.answers)){ e.answers = (e.answer && e.answerQ) ? [{q:e.answerQ, a:e.answer}] : []; delete e.answer; delete e.answerQ; }
    const lk = habaLookup(e.title);
    if(lk.exact){
      const ids = lk.ids;
      if(JSON.stringify(habaIdsOf(e)) !== JSON.stringify(ids)){ relinked++; }
      e.habaId = lk.book.id; e.habaIds = ids; e.must20 = lk.book.must20;
      const cs = new Set((e.categories && e.categories.length ? e.categories : (e.category ? [e.category] : [])));
      ids.forEach(i => cs.add(BOOK(i).category));
      e.categories = [...cs]; delete e.category;
    }
  });
  if(relinked) save();
  S.entries.sort((a,b) => (b.date||"").localeCompare(a.date||""));
  COVERS = await IDB.all();
  checkBadges();
  render();
  try{
    const man = {name:nmI()+"의 독서 기록", short_name:"독서기록", start_url:".", display:"standalone",
      background_color:"#F3EFE9", theme_color:"#F3EFE9",
      icons:[{src:ICON512, sizes:"512x512", type:"image/png", purpose:"any"},{src:ICON512, sizes:"512x512", type:"image/png", purpose:"maskable"}]};
    const l = document.createElement("link"); l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    document.head.appendChild(l);
  }catch(e){}
})();
</script>
