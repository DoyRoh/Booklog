name: nlcy-probe
on:
  push:
    branches: [claude/chaeksup-phase-0-setup-9jzohw]
    paths: [scripts/nlcy-probe.mts, .github/workflows/nlcy-probe.yml, lib/nlcy-scrape.ts, scripts/nlcy-probe.py]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
